function star(c,x,y,r,col='#fff'){c.save();c.translate(x,y);c.fillStyle=col;c.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,rd=k%2?r*.25:r;c.lineTo(Math.sin(a)*rd,-Math.cos(a)*rd)}c.closePath();c.fill();c.restore()}
function sparks(c,x,y,t,t0,n=9,R=210){
  const u=(t-t0)/.55;if(u<0||u>1)return;
  for(let k=0;k<n;k++){const a=k*Math.PI*2/n+k*.7,d=R*(.35+.65*sm(u))*(.7+.3*((k*37)%10)/10);
    c.save();c.globalAlpha=1-u;star(c,x+Math.cos(a)*d,y+Math.sin(a)*d,(10+8*((k*13)%5)/4)*(1-u*.6),k%2?'#ffffff':'#ffd23f');c.restore()}
}

function stext(c,str,x,y,size,fill,align='center',strokeW=.2,rot=0){

}

function burst(c,x,y,r,n,col,rot=0){c.save();c.translate(x,y);c.rotate(rot);c.beginPath();for(let k=0;k<n*2;k++){const a=k*Math.PI/n,rad=k%2?r*.82:r;c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}c.closePath();c.fillStyle=col;c.fill();ink(c,7);c.restore()}

  // Ersparnis-Zeile nach dem Ranking
  if(t>=T_RANK+.5){
    const k=outBack(clamp((t-T_RANK-.5)/.5)),diff=LOSE.kg-WIN.kg;
    c.save();c.translate(620,PANEL.y+PANEL.h-18);c.scale(k,k);
    rr(c,-340,-26,680,52,26);c.fillStyle='#fff';c.fill();c.lineWidth=7;c.strokeStyle='#1f9a2a';c.stroke();
    c.textAlign='center';c.textBaseline='middle';c.font=`900 28px ${FONT}`;c.fillStyle='#14171f';
    const oth=PRICED.slice(0,-1).reverse(),msg='Spar-Tipp: '+TIP;const f=fit(c,msg,650,28);c.fillText(msg,0,2);c.restore()}
}

/* ---------- Ente ---------- */
function drawDuck(c,pose,side,t,t0,t1){
  const k=popScale(t,t0,t1,.5,.3);if(k<=0)return;
  const im=S.P[pose],h=im.height,sc=690/h;
  const gx=540+side*245,gy=1900,age=t-t0;
  const sq=1+Math.sin(age*3.1)*.012;
  c.save();
  c.save();c.translate(gx,gy-6);c.scale(1,.12);const g=c.createRadialGradient(0,0,10,0,0,150*k);g.addColorStop(0,'rgba(60,30,10,.35)');g.addColorStop(1,'rgba(60,30,10,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,150*k,0,7);c.fill();c.restore();
  c.translate(gx,gy);c.rotate(Math.sin(age*2.4)*.012+(1-clamp(k))*side*.25);
  c.scale(sc*k*sq*(side<0&&(pose==='p2'||pose==='p6')?1:1),sc*k*(2-sq));
  // Pose p6/p2 zeigen nach rechts -> links stehen; wenn rechts gewünscht, spiegeln
  if((pose==='p2'||pose==='p6')&&side>0)c.scale(-1,1);
  c.drawImage(im,-im.width/2,-im.height);
  if(pose==='p7'&&S.curTag){ // Tafel: Ersparnis draufschreiben
    c.save();c.translate(-im.width/2,-im.height);
    c.translate(1215,1085);c.rotate(.07);
    const tg=S.curTag;const fs=fit(c,tg,360,170);stext(c,tg,0,0,fs,'#e8201a','center',.12);c.restore()}
  c.restore();
  sparks(c,gx,gy-300,t,t0+.04,8,230);
}
/* ---------- Kopf: Ente mit Tafel + Logo (fest) ---------- */
function drawTop(c,t){
  const im=S.P.p3,m=S.META.p3,sc=600/im.width,x0=540-im.width*sc/2,y0=30+Math.sin(t*1.6)*4;
  // sanfter Schatten
  c.save();c.shadowColor='rgba(80,30,0,.35)';c.shadowBlur=26;c.shadowOffsetY=16;c.drawImage(im,x0,y0,im.width*sc,im.height*sc);c.restore();
  const [wx0,wy0,wx1,wy1]=m.white,bx=x0+wx0*sc,by=y0+wy0*sc,bw=(wx1-wx0)*sc,bh=(wy1-wy0)*sc;
  {const top=y0+1285*sc,bot=588;c.save();c.font=`900 120px ${FONT}`;c.textAlign='center';c.textBaseline='middle';let f=120;while(c.measureText(CATEGORY).width>bw-60&&f>40){f-=4;c.font=`900 ${f}px ${FONT}`}c.fillStyle='#e8201a';c.lineJoin='round';c.lineWidth=f*.14;c.strokeStyle='#14171f';c.strokeText(CATEGORY,bx+bw/2,(top+bot)/2);c.fillText(CATEGORY,bx+bw/2,(top+bot)/2);c.restore()}
}
function drawRibbon(c,t){
  const w=720,h=112,x=540-w/2,y=594;
  c.save();c.translate(540,y+h/2);c.rotate(Math.sin(t*1.1)*.006);c.translate(-540,-(y+h/2));
  c.fillStyle='rgba(0,0,0,.25)';rr(c,x+4,y+10,w,h,24);c.fill();
  rr(c,x,y,w,h,24);c.fillStyle=grad(c,y,y+h,['#ff4a38','#c4160e']);c.fill();ink(c,8);
  c.fillStyle='rgba(255,255,255,.2)';rr(c,x+10,y+8,w-20,26,13);c.fill();
  const fs=fit(c,RIBBON,w-60,54);stext(c,RIBBON,540,y+42,fs,'#fff','center',.17);
  const ds=fit(c,DATE_TXT,w-120,34);stext(c,DATE_TXT,540,y+86,ds,'#fff4c9','center',.2);
  c.restore();
}

/* ---------- Render ---------- */
function render(t){
  t=clamp(t,0,DUR-1e-3);
  ctx.setTransform(SS,0,0,SS,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.clearRect(0,0,1080,1920);
  const z=1+.025*sm(t/DUR);
  ctx.save();ctx.translate(540,960);ctx.scale(z,z);ctx.translate(-540,-960);ctx.drawImage(S.BGC,0,0);ctx.restore();
  // Panel-Innenfläche abdunkeln für Lesbarkeit (heller Grund)
  drawRanking(ctx,t);
  // Ente: pro Zeile / Gewinner neue Pose
  const slots=ORDER.map((r,i)=>[TS[i]+.1,TS[i+1]]);slots.push([T_RANK+.1,DUR-.1]);slots.unshift([0.25,INTRO]);
  slots.forEach(([a,b],i)=>{if(t>=a&&t<=b){const [pose,side]=DUCKP[i%DUCKP.length];drawDuck(ctx,i===slots.length-1?'p2':pose,i===slots.length-1?-1:side,t,a,b)}});
  S.curTag=null;
  drawTop(ctx,t);drawRibbon(ctx,t);
}

Promise.all([load('../assets/off/bg7.jpg'),STORE.logo?load(STORE.logo):Promise.resolve(null)]
 .concat(['p1','p2','p3','p4','p5','p6','p7','p8'].map(n=>load('../assets/off/hq6/'+n+'.png')))
 ).then(async r=>{
  S.BG=r[0];S.LOGO=r[1];S.P={};['p1','p2','p3','p4','p5','p6','p7','p8'].forEach((n,i)=>S.P[n]=r[2+i]);
