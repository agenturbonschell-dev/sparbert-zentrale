<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Sparbert Intro</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:#111;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui;color:#eee}
canvas{height:min(88vh,calc(100vw*16/9));aspect-ratio:9/16;background:#000;border-radius:8px}
#ui{margin-top:8px;display:flex;gap:10px;align-items:center}
input{width:240px}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="ui"><button id="pl">⏸/▶</button><button id="rs">↺</button><input id="sk" type="range" min="0" max="22.5" step="0.01" value="0"><span id="tm">0.0s</span></div>
<script>
/* ============ KONFIGURATION ============ */
const OFFERS={title:'AKTUELLE ANGEBOTE',date:'gültig 23. – 28.11.2026',slots:0,
  logos:['../assets/logos/lidl.png'],   // z.B. ['../assets/lidl.png','../assets/kaufland.png']
  showHeader:!location.search.includes('noheader'),
  showSlots:!location.search.includes('noslots')};
const HOLD=3.4;   // Standbild für dein Voice-over
/* ======================================= */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=x=>{x=clamp(x);return x*x*x*(x*(x*6-15)+10)};
const seg=(t,a,b)=>sm((t-a)/(b-a));
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
const INK='#14171f';
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
/* ---------- Zeitplan ---------- */
const T={walk:HOLD,grab:HOLD+1.8,turn:HOLD+2.05,push:HOLD+2.6,rear:HOLD+3.5,enter:HOLD+4.6,end:HOLD+6.5};
const DUR=T.end;
// Gesten-Takte zum Sprechtext (Sekunden, Stärke): „…Dienstag, der 17. November“ / „…bei Kaufland“ / „…neue Angebote“
const BEATS=[[0.9,1],[1.7,.9],[2.35,1.5]];
function beat(t){let e=0;for(const [b,k] of BEATS)if(t>b)e+=k*Math.exp(-(t-b)*6.5);return Math.min(e,1.8)}
function glint(t){let g=0;for(const [b] of BEATS){const u=(t-b-.1)/.4;if(u>0&&u<1)g=Math.max(g,Math.sin(Math.PI*u))}return g}
/* ---------- Welt (Koordinaten von bg_out) ---------- */
const HX=420,GY=930;
const CART0={x:1372,y:703,s:.30};
const IC={x:860,y:470},RC={x:888,y:545};
const kInt=t=>lerp(.6,.92,seg(t,T.enter+.2,T.end));
const DOORX=888;
function duckAt(t){
  if(t<T.walk)return{view:'side',x:880,y:710,s:.30,sx:1,cart:0,mode:'idle',rot:Math.sin(t*1.3)*.008,breath:Math.sin(t*2.3),pa:0,reach:0};
  if(t<T.grab){const uu=clamp((t-T.walk)/(T.grab-T.walk)),u=uu<.5?2*uu*uu:1-2*(1-uu)*(1-uu);return{view:'side',x:lerp(880,CART0.x,u),y:lerp(710,CART0.y,u),s:.30,sx:1,cart:0,mode:'walk',rot:0,breath:0,pa:0,reach:seg(t,T.grab-.6,T.grab-.05)}}
  if(t<T.turn){const u=(t-T.grab)/(T.turn-T.grab);return{view:'side',x:CART0.x,y:CART0.y,s:.30,sx:1,cart:1,mode:'grab',rot:0,breath:0,grab:u}}
  if(t<T.push){const u=(t-T.turn)/(T.push-T.turn);return{view:'side',x:CART0.x-70*sm(u),y:CART0.y-Math.sin(Math.PI*u)*6,s:.30,sx:1,cart:1,mode:'turn',rot:0,breath:0,grab:1}}
  if(t<T.rear){const u=sm((t-T.push)/(T.rear-T.push));return{view:'side',x:lerp(CART0.x-70,1010,u),y:lerp(CART0.y,696,u),s:lerp(.30,.27,u),sx:-1,cart:1,mode:'walk',rot:0,breath:0}}
  if(t<T.enter){
    const u=sm((t-T.rear)/(T.enter-T.rear));
    return{view:'rear',x:lerp(1061,DOORX,u),y:lerp(696,668,u),s:lerp(.27,.19,u),cart:1,mode:'walk',rot:0,breath:0};
  }
  const u=sm((t-T.enter)/(T.end-T.enter)),k=kInt(t),by=lerp(705,585,u),sIn=lerp(.32,.25,u);
  return{view:'rear',x:RC.x,y:RC.y+(by-IC.y)*k,s:sIn*k,cart:1,mode:'walk',rot:0,breath:0};
}
/* ---------- Kamera + Gehphase ---------- */
const SR=120,SIMN=Math.ceil(DUR*SR)+2,SIM={cam:new Float32Array(SIMN*3),ph:new Float32Array(SIMN),amt:new Float32Array(SIMN),dist:new Float32Array(SIMN),acc:new Float32Array(SIMN)};
// Ein einziger, durchgehend weicher Kamerafahrtweg (Hermite-Kurve durch Schlüsselpunkte: Zeit, x, y, Zoom)
const CAMKF=[[0,1000,300,1.18],[1.7,1000,304,1.22],[HOLD,1010,300,1.28],[HOLD+1.0,1170,335,1.45],[T.grab,1235,380,1.6],[T.grab+.8,1230,400,1.66],[T.rear,1030,440,1.8],[T.enter,900,480,2.1],[T.enter+1.1,890,520,2.3],[T.end,892,560,2.4]];
function camAt(t){
  const K=CAMKF;let i=0;while(i<K.length-2&&t>K[i+1][0])i++;
  const a=K[i],b=K[i+1],h=b[0]-a[0],u=clamp((t-a[0])/h),out=[];
  for(let k=1;k<4;k++){
    const tan=j=>{const p=K[Math.max(0,j-1)],n=K[Math.min(K.length-1,j+1)],dt=n[0]-p[0];return dt>0?(n[k]-p[k])/dt:0};
    const m0=tan(i)*h,m1=tan(i+1)*h,u2=u*u,u3=u2*u;
    out.push((2*u3-3*u2+1)*a[k]+(u3-2*u2+u)*m0+(-2*u3+3*u2)*b[k]+(u3-u2)*m1);
  }
  return out;
}
function simulate(){
  let prev=duckAt(0),ph=0,dist=0,psp=0,accS=0;const dt=1/SR;
  for(let i=0;i<SIMN;i++){
    const t=i*dt,d=duckAt(t),cam=camAt(t);
    const sp=Math.hypot(d.x-prev.x,d.y-prev.y)/dt,walking=d.mode==='walk';
    if(walking)ph+=sp/(1150*d.s)*Math.PI*2*dt;
    SIM.amt[i]=walking?clamp(sp/(45*d.s),0,1):0;
    dist+=sp/SR;accS+=((sp-psp)*SR-accS)*.05;psp=sp;
    SIM.dist[i]=dist;SIM.acc[i]=accS;SIM.ph[i]=ph;SIM.cam[i*3]=cam[0];SIM.cam[i*3+1]=cam[1];SIM.cam[i*3+2]=cam[2];prev=d;
  }
}
/* ---------- Ente von der Seite ---------- */
const SH=[205,442],NECK=[255,388],HIPB=[140,700],HIPF=[250,700],ANKB=[108,802],ANKF=[272,806];
function tube(c,x1,y1,x2,y2,w,col){c.lineCap='round';c.strokeStyle=INK;c.lineWidth=w+9;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke()}
function drawHand(c,f){
  // Handschuh im Stil des Maskottchens; +y = Richtung des Unterarms, f = Zeigefinger ausgestreckt (0..1)
  c.save();c.translate(0,14);c.lineJoin='round';c.lineCap='round';
  if(f>0.02){const L=14+84*f;tube(c,-8,46,-8,46+L,27,'#ffffff');c.strokeStyle='rgba(150,170,210,.55)';c.lineWidth=5;c.beginPath();c.moveTo(2,52);c.lineTo(2,40+L);c.stroke();c.strokeStyle=INK;c.lineWidth=3;c.beginPath();c.moveTo(-8,70);c.lineTo(-8,76);c.stroke()}
  // Handfläche
  c.fillStyle=INK;c.beginPath();c.ellipse(0,34,48,43,0,0,7);c.fill();
  c.fillStyle='#fff';c.beginPath();c.ellipse(0,34,42,37,0,0,7);c.fill();
  c.fillStyle='rgba(150,170,210,.5)';c.beginPath();c.ellipse(4,44,38,26,0,0,Math.PI);c.fill();
  // eingerollte Finger (Knöchel) an der Vorderseite
  for(const [x,y] of [[26,18],[30,38],[26,58]]){c.fillStyle=INK;c.beginPath();c.ellipse(x,y,24,17,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.ellipse(x-1,y-1,19,12.5,0,0,7);c.fill()}
  // Daumen
  c.save();c.translate(-30,34);c.rotate(.25);c.fillStyle=INK;c.beginPath();c.ellipse(0,0,17,29,0,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.ellipse(0,-1,12.5,24,0,0,7);c.fill();c.restore();
  c.restore();
}
function vArm(c,psi,beta,fing,pa=0,reach=0){
  const lu=lerp(135,165,pa)*(1-.25*reach),lf=lerp(125,128,pa)*(1-.25*reach);
  c.save();c.translate(SH[0],SH[1]);c.rotate(psi);
  tube(c,0,0,0,lu,78,'#e2201a');
  c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(-21,14);c.lineTo(-21,lu-10);c.stroke();
  c.translate(0,lu);c.rotate(beta);
  // Ellbogen
  c.fillStyle=INK;c.beginPath();c.arc(0,0,43,0,7);c.fill();c.fillStyle='#e2201a';c.beginPath();c.arc(0,0,38,0,7);c.fill();
  tube(c,0,0,0,lf,74,'#e2201a');
  c.strokeStyle='rgba(255,255,255,.2)';c.lineWidth=9;c.beginPath();c.moveTo(-20,6);c.lineTo(-20,lf-44);c.stroke();
  tube(c,0,lf-44,0,lf-4,86,'#14171f');
  c.translate(0,lf);drawHand(c,fing);
  c.restore();
}
function softShadow(c,x,y,rx,ry,a=.34){c.save();c.translate(x,y);c.scale(1,ry/rx);const g=c.createRadialGradient(0,0,rx*.12,0,0,rx);g.addColorStop(0,`rgba(15,18,35,${a})`);g.addColorStop(1,'rgba(15,18,35,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,rx,0,7);c.fill();c.restore()}
const WHEELS=[[395,935,40],[483,906,30],[633,935,38],[680,914,29]];
function drawWheels(c,ds){for(const [x,y,r] of WHEELS){c.save();c.translate(x,y);c.rotate(ds/r);c.strokeStyle='#d7dbe4';c.lineWidth=r*.17;c.lineCap='round';c.beginPath();c.moveTo(-r*.64,0);c.lineTo(r*.64,0);c.moveTo(0,-r*.64);c.lineTo(0,r*.64);c.stroke();c.fillStyle='#aab0be';c.beginPath();c.arc(0,0,r*.24,0,7);c.fill();c.strokeStyle=INK;c.lineWidth=3;c.stroke();c.restore()}}
function star(c,x,y,r){c.save();c.translate(x,y);c.fillStyle='#fff';c.strokeStyle='rgba(255,255,255,.9)';c.lineWidth=2;c.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,rr_=k%2?r*.22:r;c.lineTo(Math.sin(a)*rr_,-Math.cos(a)*rr_)}c.closePath();c.fill();c.restore()}
function leg(c,thigh,foot,hip,ank,a,f,lift){
  c.save();c.translate(0,-lift);c.translate(hip[0],hip[1]);c.rotate(a);c.translate(-hip[0],-hip[1]);
  c.drawImage(thigh,0,0);
  c.translate(ank[0],ank[1]);c.rotate(f);c.translate(-ank[0],-ank[1]);
  c.drawImage(foot,0,0);c.restore();
}
function drawSide(c,d,t,i){
  const amt=SIM.amt[i],ph=SIM.ph[i],cartMode=!!d.cart;
  const A=.34,stB=-.20,stF=.26;
  const sB=Math.sin(ph),sF=Math.sin(ph+Math.PI);
  const aB=lerp(stB,A*sB,amt),aF=lerp(stF,A*sF,amt);
  const lB=Math.max(0,-Math.cos(ph))*amt*34,lF=Math.max(0,-Math.cos(ph+Math.PI))*amt*34;
  const fB=-aB*.85+.12*Math.max(0,-Math.cos(ph))*amt,fF=-aF*.85+.12*Math.max(0,-Math.cos(ph+Math.PI))*amt;
  const hop=-Math.abs(Math.sin(ph))*17*amt;
  const pa=d.pa||0,reach=d.reach||0;
  const lean=.06*amt+(d.mode==='idle'?Math.sin(t*1.3)*.008:0);
  const sway=Math.sin(ph)*.022*amt;
  // Schatten
  if(!d.noShadow)softShadow(c,d.x-(cartMode?30:70)*d.s*d.sx,d.y+10*d.s,(cartMode?380:220)*d.s,26*d.s);
  c.save();
  const squash=d.mode==='idle'?Math.sin(Math.PI*seg(t,.2,.7))*.035+beat(t)*.018*(pa>.5?1:0):0;
  c.translate(d.x,d.y+hop*d.s);c.rotate(d.rot+lean*d.sx+sway);
  c.scale(d.s*d.sx*(1+squash*.5),d.s*(1-squash));c.translate(-HX,-GY);
  if(d.mode==='grab'){const g=Math.sin(Math.PI*d.grab);c.translate(HX,GY);c.rotate(-.03*g);c.translate(-HX,-GY)}
  leg(c,S.thighB,S.footB,HIPB,ANKB,aB,fB,lB);
  if(cartMode){const ca=clamp(SIM.acc[i]*.00018,-.07,.07)+Math.sin(ph*2)*.008*amt;c.save();c.translate(420,520);c.rotate(ca);c.translate(-420,-520);c.drawImage(S.cart2,0,0);drawWheels(c,SIM.dist[i]/d.s);c.restore()}
  leg(c,S.thighF,S.footF,HIPF,ANKF,aF,fF,lF);
  // Rumpf mit leichtem Atmen
  c.save();const br=1+(d.breath||0)*.01+Math.abs(Math.sin(ph))*.012*amt;c.translate(0,700);c.scale(1,br);c.translate(0,-700);
  c.drawImage(S.body1,0,0);
  if(cartMode){c.drawImage(S.armF,0,0);c.drawImage(S.armN,0,0)}
  else{
    // Arm: Schwingen -> Zeigen (über die Schulter auf den Laden) -> Greifen
    const swing=-Math.sin(ph)*.55*amt+.10;
    let psi=swing,beta=.30+.25*Math.max(0,Math.sin(ph))*amt;
    if(pa>0){const e=beat(t);psi=lerp(psi,2.05+.03*Math.sin(t*5.2)+.025*e,pa);beta=lerp(beta,1.0-.14*e,pa)}
    if(reach>0){psi=lerp(psi,-1.2,reach);beta=lerp(beta,.12,reach)}
    vArm(c,psi,beta,clamp((pa-.5)/.4)*(1+.12*Math.min(1,beat(t))),pa,reach);
  }
  c.restore();
  // Kopf mit Nachschwingen
  const hb=Math.sin(ph-1.0)*.05*amt+(d.mode==='idle'?Math.sin(t*1.7)*.012:0)-.07*pa-.05*beat(t)*pa+.04*Math.sin(Math.PI*seg(t,.2,.7));
  c.save();c.translate(NECK[0],NECK[1]);c.rotate(hb);c.translate(-NECK[0],-NECK[1]+0);c.drawImage(S.head,0,0);
  {const e=beat(t),raise=Math.min(1,clamp(pa*1.2)*.7+Math.min(1,e)*.5),gl=glint(t);
   if(raise>.02){c.strokeStyle=INK;c.lineWidth=9;c.lineCap='round';c.beginPath();c.moveTo(268,212-10*raise);c.quadraticCurveTo(322,198-34*raise,374,212-12*raise);c.stroke()}
   if(gl>0)star(c,372,246,30*gl)}
  c.restore();
  c.restore();
}
function drawLoneCart(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.translate(-HX,-GY);c.drawImage(S.cart2,0,0);c.restore()}
/* ---------- Ente von hinten (gezeichnet im Stil des Maskottchens) ---------- */
function blobs(c,list,fill,sh,w=7){
  c.save();c.lineJoin='round';
  c.fillStyle=INK;list.forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r+w/2,0,7);c.fill()});
  c.fillStyle=fill;list.forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.fill()});
  if(sh){c.fillStyle=sh;list.forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,.15,Math.PI-.15);c.arc(x,y-r*.25,r*.92,Math.PI-.2,.2,true);c.fill()})}
  c.restore();
}
function strokeTube(c,x1,y1,x2,y2,w,col){c.lineCap='round';c.strokeStyle=INK;c.lineWidth=w+9;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke()}
function cartRear(c,sw){
  c.save();c.translate(0,-62);c.scale(1.12,1.12);
  const wheel=(x,y,r)=>{c.fillStyle=INK;c.beginPath();c.arc(x,y,r+4,0,7);c.fill();c.fillStyle='#3a3d48';c.beginPath();c.arc(x,y,r,0,7);c.fill();c.fillStyle='#b9bec9';c.beginPath();c.arc(x,y,r*.38,0,7);c.fill()};
  // Rahmen/Beine
  strokeTube(c,-190,-95,-185,-45,14,'#b9bec9');strokeTube(c,190,-95,185,-45,14,'#b9bec9');
  strokeTube(c,-150,-95,-130,-45,12,'#9fa5b3');strokeTube(c,150,-95,130,-45,12,'#9fa5b3');
  wheel(-130,-30,28);wheel(130,-30,28);wheel(-190,-34,32);wheel(190,-34,32);
  // Ablage
  c.fillStyle='#c9ced9';rr(c,-215,-112,430,22,6);c.fill();c.strokeStyle=INK;c.lineWidth=5;c.stroke();
  // Korb
  c.beginPath();c.moveTo(-262,-330);c.lineTo(262,-330);c.lineTo(214,-118);c.lineTo(-214,-118);c.closePath();
  c.fillStyle='rgba(235,242,250,.22)';c.fill();
  c.strokeStyle='#8f95a3';c.lineWidth=5;
  for(let k=1;k<10;k++){const u=k/10;c.beginPath();c.moveTo(lerp(-262,262,u),-330);c.lineTo(lerp(-214,214,u),-118);c.stroke()}
  for(const y of[-260,-190]){const u=(y+330)/212,hw=lerp(262,214,u);c.beginPath();c.moveTo(-hw,y);c.lineTo(hw,y);c.stroke()}
  c.strokeStyle=INK;c.lineWidth=5;c.beginPath();c.moveTo(-262,-330);c.lineTo(262,-330);c.lineTo(214,-118);c.lineTo(-214,-118);c.closePath();c.stroke();
  c.strokeStyle='#d5dae4';c.lineWidth=9;c.beginPath();c.moveTo(-262,-330);c.lineTo(262,-330);c.stroke();
  // Griffstange (rot) + Pfosten
  strokeTube(c,-248,-330,-248,-420,18,'#e8201a');strokeTube(c,248,-330,248,-420,18,'#e8201a');
  strokeTube(c,-256,-428,256,-428,26,'#e8201a');
  c.restore();
}
function drawRear(c,d,t,i){
  const amt=SIM.amt[i],ph=SIM.ph[i],sw=Math.sin(ph)*amt,bob=Math.abs(Math.sin(ph))*12*amt;
  c.save();
  softShadow(c,d.x,d.y+3*d.s,340*d.s,26*d.s);
  c.translate(d.x,d.y);c.scale(d.s*.97,d.s*.97);
  c.translate(0,-bob*.4);cartRear(c,sw);c.translate(0,bob*.4);
  // Beine + Füße
  for(const side of[-1,1]){
    const p=ph+(side>0?Math.PI:0),lift=Math.max(0,Math.sin(p))*58*amt,fy=-28-lift,fx=side*66;
    strokeTube(c,side*62,-200,fx+side*3,fy-6,50,'#f6a31a');
    c.save();c.translate(fx,fy);c.scale(1,1-lift*.003);
    c.fillStyle=INK;c.beginPath();c.ellipse(0,0,86,36,0,0,7);c.fill();
    c.fillStyle='#f6a31a';c.beginPath();c.ellipse(0,-1,80,31,0,0,7);c.fill();
    c.fillStyle='#ffc94d';c.beginPath();c.ellipse(-8,-9,52,10,0,0,7);c.fill();
    c.strokeStyle=INK;c.lineWidth=4;for(const dx of[-26,0,26]){c.beginPath();c.moveTo(dx,-14);c.lineTo(dx,-30);c.stroke()}
    c.restore();
  }
  c.translate(sw*8,-bob);
  c.translate(0,-190);c.rotate(sw*.028);c.translate(0,190);
  const hem=sw*9;
  // Mantel
  let g=c.createLinearGradient(-175,0,175,0);g.addColorStop(0,'#b3120d');g.addColorStop(.28,'#ee2a22');g.addColorStop(.72,'#ee2a22');g.addColorStop(1,'#b3120d');
  c.beginPath();c.moveTo(-118,-508);c.lineTo(118,-508);c.quadraticCurveTo(152,-400,176,-196+hem);c.quadraticCurveTo(0,-160,-176,-196-hem);c.quadraticCurveTo(-152,-400,-118,-508);c.closePath();
  c.fillStyle=g;c.fill();c.lineJoin='round';c.strokeStyle=INK;c.lineWidth=8;c.stroke();
  // Saum (schwarz)
  c.beginPath();c.moveTo(176,-196+hem);c.quadraticCurveTo(0,-160,-176,-196-hem);c.strokeStyle=INK;c.lineWidth=18;c.stroke();
  // Rückenschlitz
  c.fillStyle=INK;c.beginPath();c.moveTo(-9,-318);c.lineTo(9,-318);c.lineTo(15,-172+hem*.2);c.lineTo(-15,-172+hem*.2);c.fill();
  // Gürtel
  c.fillStyle='#1b1b21';c.beginPath();c.moveTo(-146,-352);c.lineTo(146,-352);c.lineTo(152,-312);c.lineTo(-152,-312);c.closePath();c.fill();c.strokeStyle=INK;c.lineWidth=4;c.stroke();
  c.fillStyle='rgba(255,255,255,.14)';c.fillRect(-146,-350,292,8);
  // Glanz am Mantel

function renderDuck(c,t,i){
  if(t<T.walk){renderHold(c,t,i);return}

    // Gehen zum Wagen mit dem Gehzyklus; kurz vor dem Greifen Überblendung in die Wagen-Figur
    const d=duckAt(t),w2=seg(t,T.grab-.2,T.grab-.01);
    drawWalk(c,d,t,i,1-w2,false);
    if(w2>0){c.save();c.globalAlpha=w2;drawSide(c,{view:'side',x:CART0.x,y:CART0.y,s:.30,sx:1,cart:1,mode:'grab',grab:0,rot:0,breath:0,noShadow:true},t,i);c.restore()}
    return;
  }
  // Wende am Wagen: Seite (rechts) -> 3/4 -> Front -> 3/4 (gespiegelt) -> Seite (links); Griff bleibt der Drehpunkt
  if(t>=T.turn&&t<T.push){
    const u=(t-T.turn)/(T.push-T.turn),d=duckAt(t),hx=d.x,k=d.s*1.88,hy=d.y-410*d.s;
    softShadow(c,hx-10*d.s,d.y+10*d.s,360*d.s,26*d.s);

    let cum=0;
    for(const [nm,w] of L){
      if(w<.003)continue;cum+=w;c.save();c.globalAlpha=w/cum;
      if(nm==='old')drawSide(c,{...d,sx:1,mode:'grab',noShadow:true},t,i);
      else if(nm==='oldf')drawSide(c,{...d,sx:-1,mode:'grab',noShadow:true},t,i);
      else if(nm==='n34')drawNew(c,S.N34,hx,hy,k,false);
      else if(nm==='nf')drawNew(c,S.NF,hx,hy,k,false);
      else drawNew(c,S.N34,hx,hy,k,true);
      c.restore();
    }
    return;
  }
  // Übergang Seite -> Rückansicht (Dreiviertel): weiche Überblendung, Körpermitte bleibt gleich
